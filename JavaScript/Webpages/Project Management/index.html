<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    h1 {
        text-align: center;
        margin-top: 20px;
    }
</style>

<body>
    <h1>Project Management</h1>

    <div class="container">
        <!-- Example: Standard Search Input Group -->
        <div class="input-group">
            <input type="search" id="searchInput" class="form-control" placeholder="Search Projects..."
                aria-label="Search">
            <button class="btn btn-primary" id="searchButton" type="submit">Search</button>
        </div>


    </div>
    <div class="container">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">No.</th>
                    <th scope="col">Project Name</th>
                    <th scope="col">Department</th>
                    <th scope="col">Priority</th>
                    <th scope="col">Status</th>
                    <th scope="col">Start Date</th>
                    <th scope="col">End Date</th>



                </tr>
            </thead>
            <tbody id="projectsRows"></tbody>
        </table>
    </div>







    <div id="pagination" class="mt-3 text-center"></div>







    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
